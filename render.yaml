services:
  - type: web
    name: ff-store
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BOT_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: FAMGATEWAY_API_KEY
        sync: false
      - key: FAMGATEWAY_MERCHANT_ID
        sync: false
      - key: FAMGATEWAY_BASE_URL
        value: https://api.famgateway.com/v1
      - key: DATABASE_URL
        fromDatabase:
          name: ff-store-db
          property: connectionString

databases:
  - name: ff-store-db
    databaseName: ff_store
    user: ff_store_user
    region: singapore
    plan: free